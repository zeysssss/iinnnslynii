
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nice to meet you ✨</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: #090914;
}

/* Live wallpaper */
#stars {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, #30205a, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #351644, transparent 50%),
    #090914;
}

.star {
  position: absolute;
  color: white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.8); }
  to { opacity: 1; transform: scale(1.2); }
}

/* Main card */
.card {
  position: relative;
  text-align: center;
  padding: 40px 25px;
  width: 90%;
  max-width: 380px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 25px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 50px #a56aff15;
  animation: appear 1s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.emoji {
  font-size: 40px;
  margin-bottom: 22px;
}

h1 {
  font-size: 29px;
  line-height: 1.4;
  margin-bottom: 12px;
}

h1 span {
  color: #d0b4ff;
}

p {
  font-size: 13px;
  color: #c6c1d5;
  line-height: 1.8;
}

button {
  margin-top: 27px;
  padding: 14px 23px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg, #c5a5ff, #f1c6ff);
  color: #21142e;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 25px #c5a5ff60;
}

#surprise {
  display: none;
  margin-top: 24px;
  color: #e5d5ff;
  font-size: 14px;
  line-height: 1.9;
  animation: appear .5s ease;
}

.footer {
  margin-top: 28px;
  color: #827792;
  font-size: 10px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="card">
  <div class="emoji">🌙✨</div>

  <h1>Nice to meet you,<br>
    <span>Iin Sulyani.</span>
  </h1>

  <p>
    Just a little something<br>
    I made for you :)
  </p>

  <button onclick="surprise()">
    Click for a surprise ✨
  </button>

  <div id="surprise">
    Wkwk, akhirnya diklik juga 👀<br><br>
    Anyway, seneng bisa kenal lo, Iin.<br>
    Semoga abis ini makin seru ngobrolnya hehe 🤍
  </div>

  <div class="footer">MADE JUST FOR YOU</div>
</div>

<script>
// Animated stars
const sky = document.getElementById("stars");

for (let i = 0; i < 90; i++) {
  const star = document.createElement("span");
  star.className = "star";
  star.innerHTML = "✦";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.fontSize = (Math.random() * 8 + 4) + "px";
  star.style.animationDelay = Math.random() * 3 + "s";
  sky.appendChild(star);
}

// Surprise button
function surprise() {
  const msg = document.getElementById("surprise");
  msg.style.display = "block";
}
</script>

</body>
</html>
